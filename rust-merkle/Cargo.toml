[package]
name = "rust-merkle"
version = "0.1.0"
edition = "2021"

[lib]
name = "rust_merkle"
path = "src/lib.rs"

[[bin]]
name = "rust-merkle"
path = "src/main.rs"

[[bin]]
name = "check-sorted"
path = "src/bin/check_sorted.rs"

[[bin]]
name = "merkle-proof"
path = "src/bin/proof.rs"

[dependencies]
sha3 = "0.10"
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
hex = "0.4"
indicatif = "0.17"
